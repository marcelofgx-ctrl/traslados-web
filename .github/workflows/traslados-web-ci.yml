name: Traslados Web — Desarrollo autónomo

on:
  push:
    branches:
      - web-traslados-desarrollo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Cloudflare sin dependencias Lovable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://xetklwcxebcpnkrdrmaa.supabase.co
      SUPABASE_URL: https://xetklwcxebcpnkrdrmaa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: build-only-test-key
      SUPABASE_PUBLISHABLE_KEY: build-only-test-key
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Instalar dependencias sin Lovable
        run: bun install
      - name: Construir web con Cloudflare
        run: bun run build
      - name: Guardar compilación
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-traslados-cloudflare
          path: |
            dist/
            .output/
          if-no-files-found: warn
          retention-days: 7

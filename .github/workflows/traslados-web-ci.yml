name: Traslados Web — CI independiente

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cloudflare Workers / TanStack Start
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.2.15', '1.3.4']
    env:
      # Valores de compilación solamente; no son credenciales operativas.
      VITE_SUPABASE_URL: https://xetklwcxebcpnkrdrmaa.supabase.co
      SUPABASE_URL: https://xetklwcxebcpnkrdrmaa.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: build-only-test-key
      SUPABASE_PUBLISHABLE_KEY: build-only-test-key
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Pruebas seguridad origen WebAuthn
        run: bun test tests/passkey-origin.test.ts tests/customer-history.test.ts tests/geo-route.test.ts tests/verified-road-cache.test.ts tests/pickup-eta-policy.test.ts tests/workers-canonical.test.ts tests/public-branding.test.ts tests/cliente-apk-install.test.ts tests/location-permission.test.ts tests/guest-booking.test.ts tests/uy-pois.test.ts tests/uy-osm-index.test.ts
      - name: Compilar web sin Lovable
        run: bun run build
      - name: Comprobar TypeScript estrictamente
        run: bunx tsc --noEmit
      - name: Prueba HTTP local del Worker
        shell: bash
        run: |
          set -euo pipefail
          bunx wrangler dev --local --port 8787 >/tmp/traslados-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          status=000
          for i in {1..25}; do
            status="$(curl -s -o /tmp/traslados-index.html -w '%{http_code}' --max-time 4 http://127.0.0.1:8787/ || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            cat /tmp/traslados-worker.log
            echo "Worker no respondió 200: $status"
            exit 1
          fi
          grep -q 'Cada viaje' /tmp/traslados-index.html || { echo "Falta contenido home"; head -c 500 /tmp/traslados-index.html; exit 1; }
          echo "SSR HTTP 200: la portada responde correctamente."
          shops="$(curl -fsS 'http://127.0.0.1:8787/api/public/places-search?q=Plaza%20Italia%20Shopping')"
          echo "$shops" | grep -q '"enabled":false' || { echo "Sin clave, búsqueda de POIs debe conservar fallback IDE/local"; exit 1; }
          echo "Búsqueda POI con proveedor opcional verificada."
          routepage="$(curl -s -o /tmp/traslados-distancia.html -w '%{http_code}' http://127.0.0.1:8787/distancia)"
          [ "$routepage" = "200" ] || { echo "Consulta pública de distancia no disponible: $routepage"; exit 1; }
          grep -q 'Cuántos kilómetros' /tmp/traslados-distancia.html || { echo "No se renderizó el calculador"; exit 1; }
          missing_provider="$(curl -s -o /tmp/traslados-no-ruta.json -w '%{http_code}' 'http://127.0.0.1:8787/api/public/route-estimate?points=-56.01638%2C-34.83696%3B-56.18%2C-34.9')"
          if [ "$missing_provider" = "503" ]; then
            grep -q '"not_configured"' /tmp/traslados-no-ruta.json || { echo "Falta aviso sin ORS"; exit 1; }
          elif [ "$missing_provider" = "200" ]; then
            grep -q '"supabase_route_cache"' /tmp/traslados-no-ruta.json || { echo "Sin ORS solo se admiten rutas ROAD cacheadas"; exit 1; }
            grep -q '"referenceFareUyu"' /tmp/traslados-no-ruta.json || { echo "Falta tarifa real del backend"; exit 1; }
          else
            echo "Respuesta de ruta inesperada: HTTP $missing_provider"; exit 1
          fi
          echo "Calculador verificado: no hace tráfico OSRM demo, acepta cache ROAD o no disponible."

          # Recursos de la PWA que antes faltaban en la web migrada.
          for asset in /manifest.webmanifest /icons/icon-192.png /icons/icon-512.png /icon.svg; do
            code="$(curl -s -o /tmp/traslados-asset -w '%{http_code}' --max-time 5 "http://127.0.0.1:8787$asset")"
            [ "$code" = "200" ] || { echo "Recurso PWA inválido: $asset ($code)"; exit 1; }
          done
          # Cloudflare puede canonizar /offline.html con HTTP 307.
          curl -fsSL http://127.0.0.1:8787/offline.html -o /tmp/traslados-offline.html
          grep -q 'Nos reencontramos' /tmp/traslados-offline.html || { echo "La página offline no se entregó correctamente"; exit 1; }
          curl -fsS http://127.0.0.1:8787/manifest.webmanifest | grep -q '"standalone"' || { echo "Falta manifiesto instalable"; exit 1; }
          echo "PWA: manifiesto, iconos y página offline validados."
          curl -fsSL 'http://127.0.0.1:8787/data/uy-pois.json' -o /tmp/uy-pois-ci.json
          python - <<'PY'
          import json
          with open("/tmp/uy-pois-ci.json",encoding="utf-8") as file:
              places=json.load(file)["items"]
          assert len(places)>5000, "Índice incompleto"
          found=[p for p in places if "punta carretas shopping" in p[1].lower() and p[4]=="MONTEVIDEO"]
          assert found, "No se encontró Punta Carretas Shopping en el índice OSM real"
          print("Índice HTTP: ",len(places),"POIs. Punta Carretas Shopping:",len(found))
          PY

          pk="$(curl -fsS http://127.0.0.1:8787/api/auth/passkey)"
          echo "$pk" | grep -q '"enabled":false' || { echo "Passkey debe estar desactivado sin secretos"; exit 1; }
          denied="$(curl -sS -o /tmp/passkey-response.json -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:8787' \
            -H 'Content-Type: application/json' \
            --data '{"step":"authenticate-options"}' \
            http://127.0.0.1:8787/api/auth/passkey)"
          [ "$denied" = 403 ] || { cat /tmp/passkey-response.json; echo "Protección de origen falló: $denied"; exit 1; }
          echo "Passkey bloqueado sin claves e impide llamadas desde origen no permitido."
      - name: "Comprobar Edge ETA - cliente no autenticado no puede leer GPS"
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sSL --max-time 18 -o /tmp/pickup-eta-denied.json \
            -D /tmp/pickup-eta-denied.headers -w '%{http_code}' \
            -X POST 'https://zetaudvvutlouiqxopvg.supabase.co/functions/v1/pickup-eta' \
            -H 'Origin: https://marcelofgx-ctrl.github.io' \
            -H 'apikey: sb_publishable_HnbMZW2dKpm6mBq-y5qkaA_Jlfx4BB9' \
            -H 'Content-Type: application/json' \
            --data '{"sessionToken":"invalid-test-token-that-cannot-authenticate-123456789","originLat":-34.832,"originLng":-56.08}')"
          printf 'Edge invalid-session HTTP: %s\n' "$status"
          test "$status" = "401"
          python3 - <<'PY'
          import json
          with open('/tmp/pickup-eta-denied.json') as f:d=json.load(f)
          assert d.get("available") is False and d.get("reason")=="login_required"
          assert "driverLat" not in d and "driverLng" not in d
          print("PASS: no se filtraron coordenadas ni disponibilidad a sesión inválida")
          PY
          grep -qi '^access-control-allow-origin: https://marcelofgx-ctrl.github.io' /tmp/pickup-eta-denied.headers

      - name: Diagnóstico de ruta real publicada en Cloudflare (sin desplegar ni leer secretos)
        shell: bash
        run: |
          set -euo pipefail
          url='https://traslados-web.marcelof-gx.workers.dev/api/public/route-estimate?points=-56.01638%2C-34.83696%3B-56.18%2C-34.9'
          status="$(curl -sSL --retry 2 --retry-delay 2 --max-time 25 \
            -H 'Origin: https://marcelofgx-ctrl.github.io' \
            -D /tmp/route-public.headers -o /tmp/route-public.json \
            -w '%{http_code}' "$url" || true)"
          echo "HTTP Worker producción: $status"
          if grep -qi '^access-control-allow-origin: https://marcelofgx-ctrl.github.io' /tmp/route-public.headers; then
            echo "CORS Pasajero PWA: PERMITIDO"
          else
            echo "CORS Pasajero PWA: NO CONFIRMADO (revisar si el navegador puede consultar)"
          fi
          ROUTE_HTTP="$status" python3 - <<'PY'
          import json,os
          try:
            with open('/tmp/route-public.json',encoding='utf8') as f: data=json.load(f)
          except Exception:
            print("SIN JSON: el endpoint no respondió o hubo un bloqueo de red.")
            raise SystemExit(0)
          ok=data.get('available') is True
          source=data.get('source')
          km=data.get('distanceKm')
          mins=data.get('durationMin')
          fare=data.get('referenceFareUyu')
          reason=data.get('reason')
          print("Ruta por carretera:", "DISPONIBLE" if ok else "NO DISPONIBLE")
          if ok:
            print("Fuente:",source if source in ('openrouteservice','supabase_route_cache') else "desconocida")
            print("Distancia válida:",isinstance(km,(float,int)) and km>0)
            print("Tiempo válido:",isinstance(mins,(float,int)) and mins>=0)
            print("Tarifa interna incluida:",isinstance(fare,(float,int)) and fare>0)
            if isinstance(km,(float,int)) and isinstance(mins,(float,int)):
              print("Ruta de control:",round(km,1),"km /",round(mins),"min")
            if isinstance(fare,(float,int)):print("Precio orientativo de control: UYU",round(fare))
            if source=='supabase_route_cache':
              print("ATENCIÓN: solo recuperación de caché; ORS para destinos nuevos no acreditado.")
          else:
            print("Motivo:",reason if reason in ('not_configured','temporarily_unavailable','no_route','invalid_points') else 'desconocido')
            if reason=='not_configured':
              print("PENDIENTE: ORS_API_KEY debe existir en el Worker publicado; compilar no despliega.")
            elif reason=='temporarily_unavailable':
              print("PENDIENTE: comprobar validez/permiso/cuota de clave ORS y logs del Worker.")
          print("Este paso es diagnóstico y NO publica cambios en Cloudflare ni accede a credenciales.")
          PY

      - name: Guardar artefacto de compilación
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: traslados-web-cloudflare
          path: |
            dist/
            .output/
          if-no-files-found: error
          retention-days: 7

name: Actualizar lugares de Uruguay (OpenStreetMap)

on:
  push:
    branches:
      - feature/uy-osm-poi-index-20261009
    paths:
      - scripts/build-uy-pois.py
      - .github/workflows/uy-pois-index.yml
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizacion-pois-uruguay
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar lector de OpenStreetMap
        run: python -m pip install --disable-pip-version-check "osmium>=4.0,<5"
      - name: Descargar extracto oficial Uruguay de Geofabrik
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 15 \
            --max-time 180 -o /tmp/uruguay-latest.osm.pbf \
            https://download.geofabrik.de/south-america/uruguay-latest.osm.pbf
          test "$(stat -c%s /tmp/uruguay-latest.osm.pbf)" -gt 10000000
      - name: Generar índice OSM sin entradas manuales
        run: |
          python scripts/build-uy-pois.py \
            --pbf /tmp/uruguay-latest.osm.pbf \
            --output public/data/uy-pois.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/data/uy-pois.json")
          data = json.loads(path.read_text())
          assert len(data["items"]) > 5000, "El índice POI no tiene suficientes lugares"
          print("Índice generado OK:", len(data["items"]), "lugares")
          PY
      - name: Publicar solo el índice en el repositorio
        run: |
          if git diff --quiet -- public/data/uy-pois.json && git ls-files --error-unmatch public/data/uy-pois.json >/dev/null 2>&1; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/uy-pois.json
          git commit -m "datos: índice actualizado de lugares OSM Uruguay [skip ci]"
          git push

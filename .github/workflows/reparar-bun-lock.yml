name: Reparar bun.lock una vez
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reparar-bun-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Regenerar bun.lock desde package.json
        run: bun install
      - name: Validar instalacion estricta (igual que Cloudflare)
        run: bun install --frozen-lockfile
      - name: Guardar bun.lock actualizado en main
        shell: bash
        run: |
          set -euo pipefail
          git add bun.lock
          if git diff --cached --quiet; then
            echo 'bun.lock ya estaba sincronizado.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: sincronizar bun.lock con dependencias Cloudflare'
            git push origin HEAD:main
          fi
